upstream media_downloader_php {
    zone media_downloader_php 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server app:9000 resolve;
}

map $http_x_forwarded_for $media_downloader_forwarded_for {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

map $http_x_forwarded_host $media_downloader_forwarded_host {
    default $http_x_forwarded_host;
    "" $http_host;
}

map $http_host $media_downloader_host_port {
    ~:(?<media_downloader_explicit_port>[0-9]+)$ $media_downloader_explicit_port;
    default $server_port;
}

map $http_x_forwarded_port $media_downloader_forwarded_port {
    default $http_x_forwarded_port;
    "" $media_downloader_host_port;
}

map $http_x_forwarded_proto $media_downloader_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_X_FORWARDED_FOR $media_downloader_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $media_downloader_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $media_downloader_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $media_downloader_forwarded_proto;
        fastcgi_pass media_downloader_php;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
