name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, pdo_sqlite, pcntl, redis, sqlite3, zip
          coverage: none

      # Temporary Composer lock regeneration to produce a reproducible
      # security patch from the actual dependency solver. Replaced with the
      # committed lock in the final PR.
      - name: Regenerate security-only Symfony lock for review
        run: |
          composer update 'symfony/http-foundation:^7.4' 'symfony/http-kernel:^7.4' 'symfony/mime:^7.4' 'symfony/routing:^7.4' 'symfony/yaml:^7.4' 'symfony/event-dispatcher:^7.4' --with-all-dependencies --no-install --no-scripts --no-progress --no-interaction
          composer audit --locked
          git diff --check
          echo 'SAVE_IT_COMPOSER_PATCH_BEGIN'
          git -c color.ui=false diff --no-ext-diff -- composer.lock
          echo 'SAVE_IT_COMPOSER_PATCH_END'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit PHP dependencies
        run: composer audit

      - name: Run Laravel tests
        run: php artisan test

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Inspect application routes
        run: php artisan route:list

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev

      - name: Build frontend assets
        run: npm run build

      - name: Validate generated icons
        run: npm run test:icons

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: extractor/requirements-dev.lock

      - name: Install pinned Python dependencies
        working-directory: extractor
        run: python -m pip install --requirement requirements-dev.lock

      - name: Run extractor tests
        working-directory: extractor
        run: PYTHONPATH=src pytest

      - name: Check Python lint
        working-directory: extractor
        run: ruff check src tests

      - name: Check Python formatting
        working-directory: extractor
        run: ruff format --check src tests

      - name: Audit Python runtime dependencies
        working-directory: extractor
        run: pip-audit --requirement requirements.lock --no-deps --disable-pip

      - name: Import extractor application
        working-directory: extractor
        run: PYTHONPATH=src python -c "from save_it_extractor.main import app; assert app.title == 'Save It Extractor'"

  docker:
    needs: [php, frontend, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build immutable extractor, app, and Nginx images
        run: docker compose build extractor app nginx

      - name: Smoke test extractor image
        run: docker run --rm --entrypoint python media-downloader-extractor:local -c "from save_it_extractor.main import app; assert app.title == 'Save It Extractor'"

      - name: Validate Nginx configuration
        run: docker run --rm media-downloader-nginx:local nginx -t

      - name: Validate FFmpeg merge and MP3 conversion
        run: docker run --rm --entrypoint /var/www/html/scripts/validate-ffmpeg.sh media-downloader-app:local

      - name: Validate Laravel runtime initialization
        run: ./scripts/validate-runtime-init.sh media-downloader-app:local

      - name: Verify image manifests match
        run: |
          app_sha="$(docker run --rm --entrypoint sha256sum media-downloader-app:local /var/www/html/public/build/manifest.json | cut -d' ' -f1)"
          nginx_sha="$(docker run --rm --entrypoint sha256sum media-downloader-nginx:local /var/www/html/public/build/manifest.json | cut -d' ' -f1)"
          test "$app_sha" = "$nginx_sha"

      - name: Verify image icons match
        run: |
          app_sha="$(docker run --rm --entrypoint sha256sum media-downloader-app:local /var/www/html/public/icons/icon-512.png | cut -d' ' -f1)"
          nginx_sha="$(docker run --rm --entrypoint sha256sum media-downloader-nginx:local /var/www/html/public/icons/icon-512.png | cut -d' ' -f1)"
          test "$app_sha" = "$nginx_sha"
