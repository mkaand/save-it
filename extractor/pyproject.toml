[project]
name = "save-it-extractor"
version = "1.0.0"
description = "Internal extraction contract service for Save It"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.140.7",
    "pydantic==2.13.4",
    "uvicorn==0.51.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
