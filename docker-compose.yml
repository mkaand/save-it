name: media-downloader

x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: app
  image: media-downloader-app:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    APP_NAME: "${APP_NAME:-Save It}"
    APP_ENV: "${APP_ENV:-production}"
    APP_DEBUG: "${APP_DEBUG:-false}"
    APP_URL: "${APP_URL:-https://save.allmy.win}"
    APP_LOCALE: "${APP_LOCALE:-en}"
    APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
    APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Istanbul}"
    DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
    DB_DATABASE: /var/www/html/database/database.sqlite
    REDIS_HOST: redis
    REDIS_PORT: "${REDIS_PORT:-6379}"
    CACHE_STORE: "${CACHE_STORE:-redis}"
    QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
    SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
    SESSION_CONNECTION: "${SESSION_CONNECTION:-default}"
    LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
    EXTRACTOR_BASE_URL: "${EXTRACTOR_BASE_URL:-http://extractor:8000}"
    EXTRACTOR_TIMEOUT_SECONDS: "${EXTRACTOR_TIMEOUT_SECONDS:-15}"
    EXTRACTOR_CONNECT_TIMEOUT_SECONDS: "${EXTRACTOR_CONNECT_TIMEOUT_SECONDS:-2}"
  volumes:
    - ./database:/var/www/html/database
    - ./storage:/var/www/html/storage
  networks:
    - internal
  depends_on:
    extractor:
      condition: service_healthy
    redis:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true

services:
  extractor:
    build:
      context: ./extractor
      dockerfile: Dockerfile
    image: media-downloader-extractor:local
    container_name: media-downloader-extractor
    restart: unless-stopped
    environment:
      EXTRACTOR_APP_NAME: "${EXTRACTOR_APP_NAME:-save-it-extractor}"
      EXTRACTOR_ENV: "${EXTRACTOR_ENV:-production}"
      EXTRACTOR_LOG_LEVEL: "${EXTRACTOR_LOG_LEVEL:-INFO}"
      EXTRACTOR_API_VERSION: "${EXTRACTOR_API_VERSION:-1}"
      EXTRACTOR_REQUEST_TIMEOUT_SECONDS: "${EXTRACTOR_REQUEST_TIMEOUT_SECONDS:-12}"
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    init: true
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  app:
    <<: *app-service
    container_name: media-downloader-app
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx
    image: media-downloader-nginx:local
    container_name: media-downloader-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:80"
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    container_name: media-downloader-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  worker:
    <<: *app-service
    container_name: media-downloader-worker
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=90", "--no-interaction"]
    stop_grace_period: 30s

  scheduler:
    <<: *app-service
    container_name: media-downloader-scheduler
    command: ["php", "artisan", "schedule:work", "--no-interaction"]

networks:
  internal:
    name: media-downloader-internal
    driver: bridge

volumes:
  redis-data:
    name: media-downloader-redis-data
