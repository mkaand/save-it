name: media-downloader

x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: media-downloader-app:local
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    APP_NAME: "${APP_NAME:-Save It}"
    APP_ENV: "${APP_ENV:-production}"
    APP_DEBUG: "${APP_DEBUG:-false}"
    APP_URL: "${APP_URL:-https://save.allmy.win}"
    APP_LOCALE: "${APP_LOCALE:-en}"
    APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
    APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Istanbul}"
    DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
    DB_DATABASE: /var/www/html/database/database.sqlite
    REDIS_HOST: redis
    REDIS_PORT: "${REDIS_PORT:-6379}"
    CACHE_STORE: "${CACHE_STORE:-redis}"
    QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
    SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
    SESSION_CONNECTION: "${SESSION_CONNECTION:-default}"
    LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
  volumes:
    - ./database:/var/www/html/database
    - ./storage:/var/www/html/storage
  networks:
    - internal
  depends_on:
    redis:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *app-service
    container_name: media-downloader-app
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.28-alpine
    container_name: media-downloader-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    container_name: media-downloader-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  worker:
    <<: *app-service
    container_name: media-downloader-worker
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=90", "--no-interaction"]
    stop_grace_period: 30s

  scheduler:
    <<: *app-service
    container_name: media-downloader-scheduler
    command: ["php", "artisan", "schedule:work", "--no-interaction"]

networks:
  internal:
    name: media-downloader-internal
    driver: bridge

volumes:
  redis-data:
    name: media-downloader-redis-data
